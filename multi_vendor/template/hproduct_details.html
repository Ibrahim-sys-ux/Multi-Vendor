{% load static %}
{% include 'header.html' %}

<!-- Product Details -->
<div class="container mt-4">
    <div class="row">
        <div class="col-md-6">
            <img src="{{ product.image.url }}" class="img-fluid" alt="{{ product.name }}">
        </div>
        <div class="col-md-6">
            <h2>{{ product.name }}</h2>
            <p>{{ product.description }}</p>
            <h4>Price: ₹{{ product.price }}</h4>

            <!-- Add to Cart Button -->
           

            <!-- Back to Shop Button -->
            <a href="{% url 'home' %}" class="btn btn-secondary mt-2">Back to Home</a>
        </div>
    </div>
</div>
