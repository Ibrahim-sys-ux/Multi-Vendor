{% load static %}
{% include 'custheader.html' %}

<!-- Product Details -->
<div class="container mt-4">
    <div class="row">
        <div class="col-md-6">
            <img src="{{ product.image.url }}" class="img-fluid" alt="{{ product.name }}">
        </div>
        <div class="col-md-6">
            <h2>{{ product.name }}</h2>
            <p>{{ product.description }}</p>
            <h4>Price: ₹{{ product.price }}</h4>

            <!-- Add to Cart Button -->
            <form action="{% url 'add_to_cart' product.id %}" method="POST">
                {% csrf_token %}
                <label for="quantity">Quantity:</label>
                <input type="number" name="quantity" value="1" min="1" class="form-control mb-2" required>
                <button type="submit" class="btn btn-success">Add to Cart</button>
            </form>

            <!-- Add to Wishlist Button -->
            <a href="{% url 'add_to_wishlist' product.id %}" class="btn btn-outline-danger mt-2">
                ❤️ Add to Wishlist
            </a>

            <!-- Add Review Button -->
            <a href="{% url 'product_reviews' product.id %}" class="btn btn-primary mt-2">
                ⭐ Add/View Reviews
            </a>

            <!-- Back to Shop Button -->
            <a href="{% url 'custhome' %}" class="btn btn-secondary mt-2">Back to Home</a>
        </div>
    </div>
</div>

{% include 'footer.html' %}
