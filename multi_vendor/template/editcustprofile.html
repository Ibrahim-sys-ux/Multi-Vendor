{% load static %}
{% include 'custheader.html' %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white text-center">
                    <h3>Edit Profile</h3>
                </div>
                <div class="card-body">
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                   

                       

                        <div class="mb-3">
                            <label class="form-label">Username:</label>
                            <input type="text" name="username" class="form-control" value="{{ cust.username }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email:</label>
                            <input type="email" name="useremail" class="form-control" value="{{ cust.useremail }}" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Address:</label>
                            <input type="text" name="useraddress" class="form-control" value="{{ cust.useraddress }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">New Password (leave blank if unchanged):</label>
                            <input type="password" name="userpass" class="form-control">
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-success">Update Profile</button>
                            <a href="{% url 'customer_profile' %}" class="btn btn-secondary">Cancel</a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% include 'footer.html' %}
