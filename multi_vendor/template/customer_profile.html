{% load static %}
{% include 'custheader.html' %}  <!-- Include customer header -->

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white text-center">
                    <h3>Customer Profile</h3>
                </div>
                <div class="card-body text-center">
                    <!-- Display Profile Photo -->
                    

                    <table class="table">
                        <tr>
                            <th>Username:</th>
                            <td>{{ cust.username }}</td>
                        </tr>
                        <tr>
                            <th>Email:</th>
                            <td>{{ cust.useremail }}</td>
                        </tr>
                        <tr>
                            <th>Address:</th>
                            <td>{{ cust.useraddress }}</td>
                        </tr>
                    </table>
                    
                    <div class="text-center">
                        <a href="{% url 'edit_profile' %}" class="btn btn-warning">Edit Profile</a>
                        <a href="{% url 'custhome' %}" class="btn btn-secondary">Back to Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% include 'footer.html' %}
